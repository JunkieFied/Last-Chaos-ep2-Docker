name: lastchaos

services:
  mysql:
    image: mysql:5.7
    container_name: lc_mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      TZ: America/Sao_Paulo
    volumes:
      - mysql_data:/var/lib/mysql
      - ./server/db/scripts/init-grants.sql:/docker-entrypoint-initdb.d/01-grants.sql:ro
      - ./server/db/scripts/pristine_clean.sql:/docker-entrypoint-initdb.d/02-dump.sql:ro
    ports:
      - "3306:3306"
    networks:
      - lastchaos_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    command: --event-scheduler=ON --character-set-server=utf8 --collation-server=utf8_general_ci --lower_case_table_names=1 --net-read-timeout=120 --net-write-timeout=120 --sql-mode=""
    restart: unless-stopped
  lc_server:
    build:
      context: .
      dockerfile: Dockerfile.centos
    container_name: lc_server
    stdin_open: true
    tty: true
    volumes:
      - ./server:/lastchaos/server/
      - ./server_run:/lastchaos/server_run/
    ports:
    - "4001:4001"
    - "4006:4006"
    - "4101:4101"
    - "4102:4102"
    - "4105:4105"
    - "3000:3000"
    - "50401:50401"
    networks:
      - lastchaos_network
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    command:
      [
        "/bin/bash",
        "-c",
        "chmod -R 777 /lastchaos && cd /lastchaos && python server_run/python/serverstart.py && tail -f /dev/null",
      ]

volumes:
  mysql_data:

networks:
  lastchaos_network:
    driver: bridge
